<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaceCue — Practice expressing emotions</title>
<meta name="description" content="Practice expressing emotions with AI feedback." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <section id="screen-select" class="screen is-active" aria-label="Choose an emotion to practice">
    <div class="select-wrap">

      <div class="brandmark" aria-hidden="true">
        <svg viewBox="0 0 40 24" width="40" height="24" fill="none">
          <path d="M2 12 Q 7 3, 12 12 T 22 12 T 32 12 T 38 12" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
          <defs>
            <linearGradient id="waveGrad" x1="0" y1="0" x2="40" y2="0">
              <stop offset="0" stop-color="#5D3FD3"/>
              <stop offset="1" stop-color="#2FB8A6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="select-title">FaceCue</h1>
      <p class="select-subtitle">Practice expressing emotions with AI feedback.</p>

      <div class="emotion-grid" id="emotion-grid" role="list" aria-label="Emotions">
        <!-- emotion cards injected by script.js -->
      </div>

      <p class="select-footnote">Choose an emotion to begin a practice session.</p>
    </div>
  </section>

  <!-- ============================================================
       SCREEN 2 — PRACTICE CHAT
  ============================================================= -->
  <section id="screen-practice" class="screen" aria-label="Practice session">

    <!-- Desktop sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brandmark small" aria-hidden="true">
          <svg viewBox="0 0 40 24" width="26" height="16" fill="none">
            <path d="M2 12 Q 7 3, 12 12 T 22 12 T 32 12 T 38 12" stroke="url(#waveGrad2)" stroke-width="3" stroke-linecap="round" fill="none"/>
            <defs>
              <linearGradient id="waveGrad2" x1="0" y1="0" x2="40" y2="0">
                <stop offset="0" stop-color="#5D3FD3"/>
                <stop offset="1" stop-color="#2FB8A6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-word">FaceCue</span>
      </div>

      <button class="new-practice-btn" id="new-practice-btn" type="button">
        <span class="plus-icon" aria-hidden="true">+</span>
        New Practice
      </button>

      <div class="sidebar-divider" role="separator"></div>

      <p class="sidebar-label">Practice History</p>
      <ul class="history-list" id="history-list">
        <!-- history items injected by script.js -->
      </ul>
    </aside>

    <!-- Main chat column -->
    <main class="chat-main">

      <header class="chat-topbar">
        <button class="back-btn" id="back-btn" type="button" aria-label="Back to emotion selection">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          <span>Back</span>
        </button>

        <div class="emotion-badge" id="emotion-badge">
          <span class="badge-emoji" id="badge-emoji">😊</span>
          <span class="badge-text">Practicing: <strong id="badge-name">Happy</strong></span>
        </div>

        <div class="topbar-spacer" aria-hidden="true"></div>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-messages" id="chat-messages">
          <!-- messages injected by script.js -->
        </div>
      </div>

      <footer class="chat-input-bar">
        <div class="input-inner">
          <button class="upload-btn" id="upload-btn" type="button" aria-label="Upload photo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <span>Upload Photo</span>
          </button>

          <input type="file" id="file-input" accept="image/*" hidden />

          <input
            type="text"
            id="text-input"
            class="text-input"
            placeholder="Ask a question or share your thoughts…"
            aria-label="Message"
            autocomplete="off"
          />

          <button class="send-btn" id="send-btn" type="button" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2L11 13"/>
              <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </section>

</div>

<!-- Message templates (cloned by script.js, keeps JS free of large HTML strings) -->
<template id="tpl-assistant-text">
  <div class="msg msg-assistant">
    <div class="msg-avatar" aria-hidden="true"></div>
    <div class="msg-bubble msg-bubble-assistant"></div>
  </div>
</template>

<template id="tpl-user-text">
  <div class="msg msg-user">
    <div class="msg-bubble msg-bubble-user"></div>
  </div>
</template>

<template id="tpl-user-image">
  <div class="msg msg-user">
    <div class="msg-bubble msg-bubble-image">
      <img class="msg-image" alt="Uploaded expression photo" />
    </div>
  </div>
</template>

<template id="tpl-typing">
  <div class="msg msg-assistant msg-typing">
    <div class="msg-avatar" aria-hidden="true"></div>
    <div class="msg-bubble msg-bubble-assistant typing-bubble">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>
</template>

<template id="tpl-analysis-card">
  <div class="msg msg-assistant">
    <div class="msg-avatar" aria-hidden="true"></div>
    <div class="analysis-card">
      <div class="analysis-header">
        <span class="analysis-eyebrow">Expression Analysis</span>
      </div>

      <div class="analysis-body">
        <div class="dial-wrap">
          <svg class="dial-svg" viewBox="0 0 100 100" width="104" height="104">
            <circle class="dial-track" cx="50" cy="50" r="42" />
            <circle class="dial-value" cx="50" cy="50" r="42" />
          </svg>
          <div class="dial-center">
            <span class="dial-percent">0%</span>
            <span class="dial-caption">match</span>
          </div>
        </div>

        <div class="analysis-stats">
          <div class="stat-row">
            <span class="stat-label">Target Emotion</span>
            <span class="stat-value stat-target"><span class="stat-emoji"></span><span class="stat-text"></span></span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Detected Expression</span>
            <span class="stat-value stat-detected"><span class="stat-emoji"></span><span class="stat-text"></span></span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Confidence</span>
            <span class="stat-value stat-confidence"></span>
          </div>
          <div class="stat-row stat-row-secondary">
            <span class="stat-label">Secondary Emotion</span>
            <span class="stat-value stat-secondary"><span class="stat-emoji"></span><span class="stat-text"></span><span class="stat-secondary-pct"></span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module" src="entry.js"></script>
</body>
</html>
