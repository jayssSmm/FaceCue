<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaceCue — Sign in</title>
<meta name="description" content="Sign in to FaceCue to practice expressing emotions with AI feedback." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="./styles/login.css" />
<link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

<div class="auth-screen" id="auth-screen">
  <div class="auth-wrap">

    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 40 24" width="40" height="24" fill="none">
        <path d="M2 12 Q 7 3, 12 12 T 22 12 T 32 12 T 38 12" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <defs>
          <linearGradient id="waveGrad" x1="0" y1="0" x2="40" y2="0">
            <stop offset="0" stop-color="#5D3FD3"/>
            <stop offset="1" stop-color="#2FB8A6"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="auth-title" id="auth-title">Welcome back</h1>
    <p class="auth-subtitle">
      <span data-mode-only="login">New to FaceCue?</span>
      <span data-mode-only="signup">Already have an account?</span>
      <button type="button" class="swap-mode" id="swap-mode-link">
        <span data-mode-only="login">Create an account</span>
        <span data-mode-only="signup">Log in</span>
      </button>
    </p>

    <div class="auth-card">

      <button type="button" class="google-btn" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.87 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span data-mode-only="login">Continue with Google</span>
        <span data-mode-only="signup">Sign up with Google</span>
      </button>

      <div class="auth-divider"><span>or</span></div>

      <div class="auth-error" id="auth-error">
        <span>⚠</span>
        <span id="auth-error-text">Couldn't sign you in — check your details and try again.</span>
      </div>

      <form id="auth-form" novalidate>

        <div class="field-group" data-mode-only="signup">
          <label class="field-label" for="name-input">Name</label>
          <input class="field-input" type="text" id="name-input" placeholder="Your name" autocomplete="name" />
        </div>

        <div class="field-group">
          <label class="field-label" for="email-input">Email</label>
          <input class="field-input" type="email" id="email-input" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="password-input">Password</label>
          <input class="field-input" type="password" id="password-input" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <div class="field-row-between">
          <label class="remember-label" data-mode-only="login">
            <input type="checkbox" id="remember-check" />
            Remember me
          </label>
          <span data-mode-only="signup"></span>
          <a href="#" class="forgot-link" id="forgot-link" data-mode-only="login">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span data-mode-only="login">Log in</span>
          <span data-mode-only="signup">Create account</span>
        </button>
      </form>

    </div>

    <p class="legal-note">
      By continuing, you agree to FaceCue's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>

  </div>
</div>

<script>
(function () {
  const screen = document.getElementById("auth-screen");
  const swapLink = document.getElementById("swap-mode-link");
  const title = document.getElementById("auth-title");
  const submitBtn = document.getElementById("submit-btn");
  const form = document.getElementById("auth-form");
  const errorBox = document.getElementById("auth-error");
  const errorText = document.getElementById("auth-error-text");
  const googleBtn = document.getElementById("google-btn");

  function setMode(mode) {
    screen.classList.toggle("mode-signup", mode === "signup");
    title.textContent = mode === "signup" ? "Create your account" : "Welcome back";
    errorBox.classList.remove("is-visible");
  }

  swapLink.addEventListener("click", () => {
    const next = screen.classList.contains("mode-signup") ? "login" : "signup";
    setMode(next);
  });

  // Wire these up to your real auth endpoints.
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email-input").value.trim();
    const password = document.getElementById("password-input").value;

    if (!email || !password) {
      errorText.textContent = "Enter your email and password to continue.";
      errorBox.classList.add("is-visible");
      return;
    }

    // TODO: replace with fetch("/auth/login" | "/auth/signup", { ... })
    errorBox.classList.remove("is-visible");
    console.log("Submit auth form:", { email, password });
  });

  googleBtn.addEventListener("click", () => {
    // TODO: replace with your Google OAuth redirect, e.g.
    // window.location.href = "/auth/google";
    console.log("Continue with Google clicked");
  });
})();
</script>

</body>
</html>
